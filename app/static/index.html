<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b5cad">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="SOP Copilot">
  <link rel="manifest" href="/static/manifest.webmanifest">
  <link rel="icon" href="/static/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/static/icon.svg">
  <title>SOP Copilot</title>
  <link rel="stylesheet" href="/static/styles.css">
  <script>
    // Apply the saved theme before first paint to avoid a flash.
    try { const t = localStorage.getItem("theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
</head>
<body>
  <div class="app">
    <header class="top">
      <div class="brand">
        <svg class="logo" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 3h9l5 5v13H5z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M14 3v5h5M8.5 13h7M8.5 16.5h4.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        <div>
          <h1>SOP Copilot</h1>
          <p>Answers from your plant's documents</p>
        </div>
      </div>
      <div class="top-actions">
        <span id="status" class="pill" role="status">checking…</span>
        <button id="theme" class="icon-btn" type="button" aria-label="Switch light / dark theme">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A8.5 8.5 0 1 1 11.2 3a6.6 6.6 0 0 0 9.8 9.8z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
        </button>
      </div>
    </header>

    <main id="main" aria-live="polite">
      <!-- Empty state, replaced by the answer once a question is asked -->
      <section id="welcome" class="welcome">
        <h2>What do you need to know?</h2>
        <p class="lead">Ask in your own words, or just type a code like <b>AL-305</b> or <b>BH-220 OD</b>.</p>

        <h3 class="eyebrow">Try asking</h3>
        <div id="chips" class="chips"></div>

        <div id="recent-wrap" hidden>
          <h3 class="eyebrow">Recent</h3>
          <div id="recent" class="chips"></div>
        </div>

        <h3 class="eyebrow">Documents I can answer from</h3>
        <ul id="docs" class="docs"></ul>
      </section>

      <section id="result"></section>
    </main>

    <div class="dock">
      <form id="form" class="composer" autocomplete="off">
        <label for="q" class="sr">Your question</label>
        <textarea id="q" rows="1" maxlength="500" placeholder="Ask, or type a code…" enterkeyhint="send"></textarea>
        <button id="ask" type="submit" aria-label="Ask">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span>Ask</span>
        </button>
      </form>
      <p class="disclaimer">Information only. It does not replace the approvals your SOPs require.</p>
    </div>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
